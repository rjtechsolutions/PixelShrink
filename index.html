<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelShrink</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Pixel<span>Shrink</span></h1><p>Compress images privately in your browser.</p><section id="drop"><input id="file" type="file" accept="image/*" hidden><div class="icon">↑</div><h2>Drop an image here</h2><p>or <button id="browse">browse</button></p><small>JPG · PNG · WEBP</small></section><section id="app" hidden><div class="bar">Image ready <button id="change">Change image</button></div><div class="grid"><article><label>ORIGINAL</label><div class="preview"><img id="orig"></div><div class="info"><b id="os">—</b><span id="dim">—</span></div></article><div class="arrow">→</div><article><label>COMPRESSED</label><div class="preview"><img id="comp"></div><div class="info"><b id="cs">—</b><span id="save">—</span></div></article></div><div class="controls"><div><div class="head">Quality <b id="qv">80%</b></div><input id="q" type="range" min="10" max="100" value="80"></div><div><div class="head">Format</div><select id="fmt"><option value="image/webp">WebP — Recommended</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div></div><div class="result"><span id="result">Ready</span><button id="download">Download ↓</button></div><button class="reset" id="reset">Reset</button></section></main><footer>Built with HTML · CSS · JavaScript</footer><script src="script.js"></script></body></html>
